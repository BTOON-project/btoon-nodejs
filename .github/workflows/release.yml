name: Release

# On a version tag: build Node-API prebuilds for every platform, verify each one loads
# and passes the tests, load-test the packed package on the Linux distros people deploy
# on, then publish to npm with provenance. Run it by hand (workflow_dispatch) to build and
# test without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linux glibc prebuilds are built in manylinux_2_28 (AlmaLinux 8: glibc 2.28, gcc-toolset),
  # the floor of Node.js's own Linux builds. Built on the Ubuntu 24.04 runners they needed
  # GLIBC_2.38 and didn't load on Debian 12, Ubuntu 22.04, RHEL 9 or Amazon Linux 2023.
  # scripts/prebuild-linux.sh installs Node.js, builds, fails if the binary needs symbol
  # versions above GLIBC 2.28, GLIBCXX 3.4.25 or CXXABI 1.3.11, and runs the tests on it.
  prebuild-glibc:
    name: prebuild (linux-${{ matrix.arch }}, manylinux_2_28)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-latest, image: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { arch: arm64, os: ubuntu-24.04-arm, image: 'quay.io/pypa/manylinux_2_28_aarch64' }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build, check symbol versions and test (in ${{ matrix.image }})
        run: docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" bash scripts/prebuild-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds-linux-${{ matrix.arch }}
          path: prebuilds/

  prebuild:
    name: prebuild (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-musl, os: ubuntu-latest, container: 'node:22-alpine' }
          - { name: darwin-arm64, os: macos-latest }
          - { name: darwin-x64, os: macos-latest, arch: x64 }
          - { name: win32-x64, os: windows-latest }
    steps:
      - name: Install build tools (Alpine)
        if: matrix.container
        run: apk add --no-cache bash build-base python3 git
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        if: ${{ !matrix.container }}
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Build prebuild
        shell: bash
        run: |
          if [ -n "${{ matrix.arch }}" ]; then
            npx prebuildify --napi --strip --target 18.0.0 --arch ${{ matrix.arch }}
          else
            npx prebuildify --napi --strip --target 18.0.0 ${{ matrix.container && '--tag-libc' || '' }}
          fi
      - name: Test the prebuild (cross-compiled darwin-x64 is not runnable here)
        if: matrix.name != 'darwin-x64'
        shell: bash
        run: rm -rf build && npm test
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.name }}
          path: prebuilds/

  # Installs the packed package without install scripts, so nothing gets compiled, and
  # checks that the shipped prebuild loads and round-trips a document. Images without
  # Node.js get the official build from nodejs.org.
  load-test:
    name: load (${{ matrix.image }}, ${{ matrix.arch }})
    needs: [prebuild-glibc, prebuild]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        # glibc 2.31, 2.36, 2.35, 2.28 (RHEL 8) and 2.34 (also AWS Lambda's nodejs22.x)
        image: ['node:22-bullseye', 'node:22-bookworm', 'ubuntu:22.04', 'almalinux:8', 'amazonlinux:2023']
        include:
          - { arch: x64, image: 'node:22-alpine' } # musl; that prebuild is x64 only
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pack
        run: npm pack && mv btoon-*.tgz btoon.tgz
      - name: Node.js for images without one
        run: bash scripts/fetch-node.sh "$RUNNER_TEMP/node"
      - name: Load and round-trip (in ${{ matrix.image }})
        run: >-
          docker run --rm
          -v "$PWD/btoon.tgz:/pkg/btoon.tgz:ro"
          -v "$PWD/scripts/load-test.sh:/load-test.sh:ro"
          -v "$RUNNER_TEMP/node:/opt/node:ro"
          "${{ matrix.image }}" sh /load-test.sh /pkg/btoon.tgz

  publish:
    needs: [prebuild-glibc, prebuild, load-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - run: ls -R prebuilds
      - name: Check that the tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Skip if this version is already on npm
        id: published
        run: |
          spec="$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm install --ignore-scripts
        if: steps.published.outputs.skip != 'true'
      # npm >= 11.5.1 uses trusted publishing (OIDC) when it's configured on npmjs.com,
      # and falls back to the NPM_TOKEN secret otherwise.
      - run: npm install -g npm@11
        if: steps.published.outputs.skip != 'true'
      - run: npm publish --provenance --access public
        if: steps.published.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
