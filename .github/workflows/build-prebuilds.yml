name: Build Prebuilds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v0.0.5) - leave empty to skip upload'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-prebuilds:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zlib1g-dev libssl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl zlib

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

          # Install vcpkg and dependencies
          if (-not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          }
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          & C:\vcpkg\vcpkg.exe install zlib:x64-windows openssl:x64-windows

      - name: Build btoon-core (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd core
          rm -rf build
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DBUILD_BENCHMARKS=OFF \
                   -DBUILD_TESTS=OFF \
                   -DBUILD_EXAMPLES=OFF \
                   -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build . --config Release -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build btoon-core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd core
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          New-Item -ItemType Directory -Force -Path build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release `
                   -DBUILD_BENCHMARKS=OFF `
                   -DBUILD_TESTS=OFF `
                   -DBUILD_EXAMPLES=OFF `
                   -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
                   -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build . --config Release

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Build prebuilds (Linux)
        if: runner.os == 'Linux'
        run: |
          npx prebuild --target 18.0.0 --target 20.0.0 --target 22.0.0

      - name: Build prebuilds (macOS)
        if: runner.os == 'macOS'
        run: |
          npx prebuild --target 18.0.0 --target 20.0.0 --target 22.0.0 --arch arm64 --arch x64

      - name: Build prebuilds (Windows)
        if: runner.os == 'Windows'
        run: |
          npx prebuild --target 18.0.0 --target 20.0.0 --target 22.0.0 --arch x64

      - name: List prebuilds
        shell: bash
        run: |
          echo "=== Built prebuilds ==="
          ls -lh prebuilds/

      - name: Upload prebuilds as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}-node${{ matrix.node }}
          path: prebuilds/*.tar.gz
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v1
        with:
          files: prebuilds/*.tar.gz
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  collect-prebuilds:
    needs: build-prebuilds
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-prebuilds
          pattern: prebuilds-*

      - name: List all prebuilds
        run: |
          echo "=== All built prebuilds ==="
          find all-prebuilds -name "*.tar.gz" -exec ls -lh {} \;
          echo ""
          echo "=== Summary ==="
          find all-prebuilds -name "*.tar.gz" | wc -l | xargs echo "Total prebuilds:"

      - name: Combine prebuilds
        run: |
          mkdir -p combined-prebuilds
          find all-prebuilds -name "*.tar.gz" -exec cp {} combined-prebuilds/ \;

      - name: Upload combined prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: all-prebuilds
          path: combined-prebuilds/*.tar.gz
          retention-days: 90
