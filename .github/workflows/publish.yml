name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish)'
        required: false
        default: 'false'

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20]
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Fetch full history to ensure submodule commits exist
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install Python (for node-gyp)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake
      
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install git -y
      
      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          }
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:PATH = "$env:VCPKG_ROOT;$env:PATH"
          & C:\vcpkg\vcpkg.exe integrate install
          & C:\vcpkg\vcpkg.exe install zlib:x64-windows openssl:x64-windows --triplet x64-windows
      
      - name: Build btoon-core (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd core
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=OFF -DBUILD_TESTS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build . --config Release
          cd ../..
      
      - name: Build btoon-core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd core
          New-Item -ItemType Directory -Force -Path build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=OFF -DBUILD_TESTS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build . --config Release
          cd ../..
      
      - name: Install dependencies (skip install script)
        run: npm ci --ignore-scripts
      
      - name: Build native module
        run: npm run build:release
      
      - name: Run tests
        run: npm test
      
      - name: Build prebuilds
        run: npm run prebuild
      
      - name: Upload prebuilds
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run prebuild:upload
      
      - name: Publish to npm
        if: github.event_name == 'release' && matrix.os == 'ubuntu-latest' && matrix.node == 20 && github.event.inputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btoon-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            build/Release/*.node
            prebuilds/

  test-published:
    needs: build-and-publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Test published package
        run: |
          npm install btoon@latest
          node -e "const btoon = require('btoon'); console.log(btoon.encode({test: true}))"
